[package]
name = "parking_lot_lite_hack_core"
version = "0.9.13"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
description = "parking_lot_core without std, for parking_lot_lite_hack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/parking_lot_lite_hack"
keywords = ["mutex", "rwlock", "no-std", "parking-lot"]
categories = ["concurrency", "no-std"]
edition = "2021"
rust-version = "1.84"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
cfg-if = "1.0.0"
smallvec = "1.6.1"

# `default-features = false` is not tidiness. `libc`'s default features include `std`, and cargo
# unifies features across the graph, so this one line was enough to put `libstd` on the link line
# of a consumer where every other crate is `#![no_std]`. `parking_lot_core` uses `libc` for
# `futex`/`pthread` calls and none of the `std` half.
[target.'cfg(target_os = "aix")'.dependencies]
libc = { version = "0.2.181", default-features = false }

[target.'cfg(all(unix, not(target_os = "aix")))'.dependencies]
libc = { version = "0.2.95", default-features = false }


[target.'cfg(windows)'.dependencies]
windows-link = "0.2.0"
# `FlsAlloc` and `QueryPerformanceCounter`, for the `no_std` thread-local and
# clock. Unused when `std` is on.
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
    "Win32_System_Performance",
] }

[features]
default = ["std"]

# Off, this crate does not link `std`. It still blocks in the kernel: `libc`
# with default features off is itself `no_std`, so the constraint was never
# `no_std`, it was having an operating system.
#
# What changes without it: `thread_local!` becomes a `pthread_key_t` (an
# `FlsAlloc` slot on Windows), `std::time::Instant` becomes a monotonic clock
# reading, and deadlock detection is unavailable, since it is the only thing
# here that needs `HashSet`, `mpsc` and `ThreadId`.
std = []


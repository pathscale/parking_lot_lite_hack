[package]
name = "parking_lot_lite_hack_core"
version = "0.9.16"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
description = "parking_lot_core without std, for parking_lot_lite_hack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/parking_lot_lite_hack"
keywords = ["mutex", "rwlock", "no-std", "parking-lot"]
categories = ["concurrency", "no-std"]
edition = "2021"
rust-version = "1.84"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
cfg-if = "1.0.0"
smallvec = "1.6.1"
ekostd = { version = "^0.2.11", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
libc-rs = "0.2.5"

[target.'cfg(windows)'.dependencies]
windows-link = "0.2.0"
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
    "Win32_System_Performance",
] }

[features]
default = []
# Retained as a no-op alias so downstream manifests naming `parking_lot/std` keep resolving;
# the crate always uses its unified no_std + ekostd codepath.
std = []

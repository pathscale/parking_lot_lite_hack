[package]
name = "parking_lot_lite_hack"
version = "0.12.5"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
description = "parking_lot's Mutex and RwLock, without std"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/parking_lot_lite_hack"
readme = "README.md"
keywords = ["mutex", "rwlock", "no-std", "lock-api", "parking-lot"]
categories = ["concurrency", "no-std"]
edition = "2021"
rust-version = "1.84"

[package.metadata.docs.rs]
features = ["arc_lock", "send_guard"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.playground]
features = ["arc_lock", "send_guard"]

[dependencies]
parking_lot_core = { package = "parking_lot_lite_hack_core", path = "core", version = "0.9.12" }
lock_api = { path = "lock_api", version = "0.4.14" }

[dev-dependencies]
# Benchmark arms and the CPU clock. `spin` is the other `lock_api` backend
# worth measuring against; `libc` is `getrusage`, because wall clock cannot
# see a burnt core.
libc = "0.2"
# The published crate, under another name, so a benchmark can run clean
# upstream and this build in one process and interleave them. Two copies of
# `parking_lot_core` end up linked, which is exactly right: each arm uses its
# own parking lot.
parking_lot = "0.12.5"
spin = "0.9"
# The lock-free alternative a consumer actually has. A `BTreeMap` behind a lock
# is the shape this crate is for, not a structure anyone should prefer, so the
# table needs an arm that is not a lock at all.
arctic-wt = "0.1.9"
rand = "0.8.3"

[features]
default = ["std"]

# Off, this crate does not link `std`. See `parking_lot_core`'s feature of the
# same name for what changes.
std = ["parking_lot_core/std"]
arc_lock = ["lock_api/arc_lock"]
send_guard = []

[workspace]
exclude = ["benchmark"]

[[bench]]
name = "vs_parking_lot"
harness = false

[[bench]]
name = "burst"
harness = false
